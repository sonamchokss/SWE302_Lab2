<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Register Modules · CST SMS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="overlay" id="overlay"></div>
  <div class="content">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"></button>
      <h1 class="topbar-title" id="pageTitle">Register Modules</h1>
      <div class="spacer"></div>
      <div class="user-chip" id="userChip"></div>
    </header>

    <main class="page">
      <div class="page-head">
        <h2>Register for modules</h2>
        <p>Registration opens once your tuition payment and drug testing clearance are on record and the registration window is open.</p>
      </div>

      <div class="grid cols-2">
        <div class="stack">
          <section class="card">
            <div class="card-head"><h3>Before you register</h3></div>
            <div class="checklist" id="checklist"><div class="empty">Checking your status...</div></div>
          </section>

          <section class="card">
            <div class="card-head"><h3>Choose a module</h3></div>
            <form id="registerForm" novalidate>
              <label for="moduleSelect">Module</label>
              <select id="moduleSelect" disabled><option>Loading modules...</option></select>
              <div class="hint" id="moduleInfo"></div>
              <div class="field-error" id="moduleError"></div>
              <div class="form-actions">
                <button type="submit" id="registerBtn" disabled>Register module</button>
              </div>
            </form>
            <div id="regMsg" class="message" role="status"></div>
          </section>
        </div>

        <section class="card">
          <div class="card-head"><h3>My registered modules</h3></div>
          <div id="myModules"><div class="empty">Loading...</div></div>
        </section>
      </div>
    </main>
  </div>
</div>

<script src="app.js"></script>
<script>
  const user = requireLogin("student");
  if (user) initShell("register", "Register Modules");

  const registerBtn = document.getElementById("registerBtn");
  const select = document.getElementById("moduleSelect");
  const moduleInfo = document.getElementById("moduleInfo");
  const moduleError = document.getElementById("moduleError");

  let status = null;
  let allModules = [];
  let registeredCodes = [];

  function checkRow(title, ok, okText, pendingText, linkHtml) {
    return `<div class="check-row">
      <div><strong>${title}</strong><small>${ok ? okText : pendingText}</small></div>
      <div class="btn-row">${ok ? badge("Complete", "ok") : badge("Action needed", "pending")}${!ok && linkHtml ? linkHtml : ""}</div>
    </div>`;
  }

  function renderChecklist() {
    const s = status;
    document.getElementById("checklist").innerHTML = [
      checkRow("Tuition payment", s.paymentVerified, "Payment is on record.",
        "No verified payment yet.", `<a class="btn small" href="payment.html">Pay tuition</a>`),
      checkRow("Drug testing clearance", s.drugTestVerified, "Drug testing report is cleared.",
        "Waiting for the administrator to clear your drug testing report.", ""),
      checkRow("Registration period", s.registrationPeriodOpen, "The registration window is open.",
        "The registration window is currently closed.", ""),
    ].join("");
    updateRegisterState();
  }

  function updateRegisterState() {
    const eligible = status && status.paymentVerified && status.drugTestVerified && status.registrationPeriodOpen;
    const available = allModules.filter((m) => !registeredCodes.includes(m.moduleCode));
    select.disabled = !eligible || !available.length;
    registerBtn.disabled = !eligible || !select.value;
    if (!eligible) moduleInfo.textContent = "You can register once all three checks above are complete.";
    else if (!available.length) moduleInfo.textContent = "You are registered for every available module.";
    else moduleInfo.textContent = "";
  }

  function renderModules() {
    const available = allModules.filter((m) => !registeredCodes.includes(m.moduleCode));
    select.innerHTML = available.length
      ? available.map((m) => `<option value="${escapeHtml(m.moduleCode)}">${escapeHtml(m.moduleCode)} · ${escapeHtml(m.moduleTitle)} (${escapeHtml(m.credits)} credits)</option>`).join("")
      : `<option value="">No modules available</option>`;
    updateRegisterState();
  }

  function renderMine(list) {
    const box = document.getElementById("myModules");
    box.innerHTML = list.length
      ? `<div class="table-wrap"><table>
          <thead><tr><th>Code</th><th>Module</th><th class="hide-sm">Credits</th></tr></thead>
          <tbody>${list.map((m) => `<tr><td class="num"><strong>${escapeHtml(m.moduleCode)}</strong></td>
            <td>${escapeHtml(m.moduleTitle)}</td><td class="hide-sm">${escapeHtml(m.credits)}</td></tr>`).join("")}
          </tbody></table></div>`
      : `<div class="empty">You have not registered for any modules yet.</div>`;
  }

  async function loadAll() {
    const [st, mods, regs] = await Promise.all([getJSON("/api/status"), getJSON("/api/modules"), getJSON("/api/registrations")]);
    if (!st.ok || !mods.ok || !regs.ok) {
      document.getElementById("checklist").innerHTML = `<div class="message error show">Could not load your registration status. Please refresh.</div>`;
      return;
    }
    status = st.data;
    allModules = mods.data;
    registeredCodes = regs.data.map((m) => m.moduleCode);
    renderChecklist();
    renderModules();
    renderMine(regs.data);
  }

  select.addEventListener("change", () => {
    moduleError.textContent = "";
    updateRegisterState();
  });

  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("regMsg");
    clearMessage(msg);
    if (!select.value) {
      moduleError.textContent = "Choose a module to register.";
      return;
    }
    const code = select.value;
    setBusy(registerBtn, true, "Registering...");
    const { ok, data } = await postJSON("/api/register", { moduleCode: code });
    setBusy(registerBtn, false);
    if (ok) {
      notify(`${code} registered`);
      await loadAll();
    } else {
      showMessage(msg, data.message || "Registration failed. Please try again.", true);
    }
  });

  if (user) loadAll();
</script>
</body>
</html>
