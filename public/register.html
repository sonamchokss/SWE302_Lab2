<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Registration &mdash; CST SMS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <span class="crest">CST &middot; RUB</span>
  <h1>Student Management System</h1>
</header>
<nav>
  <a href="index.html">Home</a>
  <a href="login.html">Login</a>
  <a href="register.html">Registration</a>
  <a href="results.html">Results</a>
</nav>
<main>
  <div class="card">
    <h2>Tuition Payment</h2>
    <form id="paymentForm">
      <label for="screenshot">Payment Screenshot (.jpg, .jpeg, .png)</label>
      <input id="screenshot" name="screenshot" type="file" accept=".jpg,.jpeg,.png" />

      <label for="txn">Transaction Number</label>
      <input id="txn" name="txn" placeholder="e.g. 123-123456789" />

      <button type="submit">Submit Payment</button>
    </form>
    <div id="payMsg" class="message"></div>
  </div>

  <div class="card" style="margin-top:1.5rem;">
    <h2>Module Registration</h2>
    <form id="registerForm">
      <label for="studentIdReg">Student ID</label>
      <input id="studentIdReg" placeholder="e.g. 02230123" />

      <label for="moduleCode">Module Code</label>
      <input id="moduleCode" placeholder="e.g. SWE302" />

      <label for="paymentVerified">Tuition Payment Verified?</label>
      <select id="paymentVerified"><option value="true">Yes</option><option value="false">No</option></select>

      <label for="drugTestVerified">Drug Testing Report Verified?</label>
      <select id="drugTestVerified"><option value="true">Yes</option><option value="false">No</option></select>

      <label for="periodOpen">Registration Period Open?</label>
      <select id="periodOpen"><option value="true">Yes</option><option value="false">No</option></select>

      <button type="submit">Register Module</button>
    </form>
    <div id="regMsg" class="message"></div>
  </div>
</main>
<script src="app.js"></script>
<script>
  document.getElementById("paymentForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fileInput = document.getElementById("screenshot");
    const msg = document.getElementById("payMsg");
    const fd = new FormData();
    if (fileInput.files[0]) fd.append("screenshot", fileInput.files[0]);
    fd.append("transactionNumber", document.getElementById("txn").value);
    const res = await fetch("/api/payment", { method: "POST", body: fd });
    const data = await res.json();
    showMessage(msg, data.message, !res.ok);
  });

  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("regMsg");
    const body = {
      studentId: document.getElementById("studentIdReg").value,
      moduleCode: document.getElementById("moduleCode").value,
      paymentVerified: document.getElementById("paymentVerified").value === "true",
      drugTestVerified: document.getElementById("drugTestVerified").value === "true",
      registrationPeriodOpen: document.getElementById("periodOpen").value === "true",
    };
    const { ok, data } = await postJSON("/api/register", body);
    showMessage(msg, data.message, !ok);
  });
</script>
</body>
</html>
