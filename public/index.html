<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dashboard · CST SMS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="overlay" id="overlay"></div>
  <div class="content">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"></button>
      <h1 class="topbar-title" id="pageTitle">Dashboard</h1>
      <div class="spacer"></div>
      <div class="user-chip" id="userChip"></div>
    </header>

    <main class="page" id="main">
      <div id="dashboard" aria-live="polite">
        <div class="empty">Loading your dashboard...</div>
      </div>
    </main>
  </div>
</div>

<script src="app.js"></script>
<script>
  const user = requireLogin();
  if (user) initShell("dashboard", "Dashboard");

  const box = document.getElementById("dashboard");

  function greeting() {
    const h = new Date().getHours();
    return h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
  }

  function stat(label, valueHtml, subHtml) {
    return `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${valueHtml}</div><div class="stat-sub">${subHtml}</div></div>`;
  }

  function welcome(subtitle) {
    const firstName = escapeHtml(String(user.fullName || user.studentId).split(" ")[0]);
    return `<section class="welcome">
      <div>
        <h2>${greeting()}, ${firstName}</h2>
        <p>${subtitle}</p>
      </div>
    </section>`;
  }

  async function renderStudent() {
    const [status, regs, results, payments] = await Promise.all([
      getJSON("/api/status"), getJSON("/api/registrations"), getJSON("/api/results"), getJSON("/api/payments"),
    ]);
    if (!status.ok || !regs.ok || !results.ok || !payments.ok) {
      box.innerHTML = `<div class="message error show">We could not load your dashboard. Please refresh the page.</div>`;
      return;
    }
    const s = status.data;

    const banner = s.paymentVerified ? "" : `
      <div class="banner" role="status">
        <span>Your tuition payment is not on record yet. You need to pay before you can register for modules.</span>
        <a class="btn small" href="payment.html">Pay tuition</a>
      </div>`;

    const modules = regs.data.length
      ? `<div class="table-wrap"><table>
           <thead><tr><th>Code</th><th>Module</th><th class="hide-sm">Credits</th><th>Status</th></tr></thead>
           <tbody>${regs.data.map((m) => `
             <tr><td class="num"><strong>${escapeHtml(m.moduleCode)}</strong></td><td>${escapeHtml(m.moduleTitle)}</td>
             <td class="hide-sm">${escapeHtml(m.credits)}</td><td>${badge("Registered", "info")}</td></tr>`).join("")}
           </tbody></table></div>`
      : `<div class="empty">You have not registered for any modules yet.</div>`;

    const recent = results.data.slice(0, 4).map((r) => `
      <div class="check-row">
        <div><strong>${escapeHtml(r.moduleCode)}</strong><small>${escapeHtml(r.moduleTitle)}</small></div>
        ${gradeChip(r.grade)}
      </div>`).join("");

    box.innerHTML = `
      ${welcome(`Here is your academic overview. Student ID ${escapeHtml(user.studentId)}.`)}
      ${banner}
      <div class="grid stats">
        ${stat("Tuition payment", s.paymentVerified ? badge("Verified", "ok") : badge("Not verified", "pending"),
          `${payments.data.length} payment${payments.data.length === 1 ? "" : "s"} on file`)}
        ${stat("Drug testing", s.drugTestVerified ? badge("Cleared", "ok") : badge("Pending", "pending"),
          "Confirmed by the administrator")}
        ${stat("Registration", s.registrationPeriodOpen ? badge("Open", "ok") : badge("Closed", "closed"),
          "Module registration window")}
        ${stat("Modules", String(regs.data.length), `${results.data.length} result${results.data.length === 1 ? "" : "s"} published`)}
      </div>

      <div class="grid cols-2 section-gap">
        <section class="card">
          <div class="card-head"><h3>My registered modules</h3>
            <a class="btn secondary small" href="register.html">Manage</a></div>
          ${modules}
        </section>

        <div class="stack">
          <section class="card">
            <h3 style="margin-bottom:12px">Quick actions</h3>
            <div class="actions">
              <a class="action" href="payment.html">
                <span class="action-icon">${icon("payment")}</span>
                <span><strong>Pay tuition</strong><small>Upload your proof and transaction number</small></span>
              </a>
              <a class="action" href="register.html">
                <span class="action-icon">${icon("register")}</span>
                <span><strong>Register modules</strong><small>Choose this semester's modules</small></span>
              </a>
              <a class="action" href="results.html">
                <span class="action-icon">${icon("results")}</span>
                <span><strong>View results</strong><small>See grades and download your statement</small></span>
              </a>
            </div>
          </section>

          <section class="card">
            <div class="card-head"><h3>Recent results</h3></div>
            ${recent ? `<div class="checklist">${recent}</div>` : `<div class="empty">No results published yet.</div>`}
          </section>
        </div>
      </div>`;
  }

  async function renderAdmin() {
    const [students, results, payments, settings] = await Promise.all([
      getJSON("/api/students"), getJSON("/api/results"), getJSON("/api/payments"), getJSON("/api/settings"),
    ]);
    if (!students.ok || !results.ok || !payments.ok || !settings.ok) {
      box.innerHTML = `<div class="message error show">We could not load the dashboard. Please refresh the page.</div>`;
      return;
    }
    const open = settings.data.registrationPeriodOpen;
    const recent = payments.data.slice().reverse().slice(0, 6);

    box.innerHTML = `
      ${welcome("Overview of students, grades, tuition payments and registration.")}
      <div class="grid stats">
        ${stat("Students", String(students.data.length), "Registered student accounts")}
        ${stat("Results recorded", String(results.data.length), "Grades across all modules")}
        ${stat("Payments received", String(payments.data.length), "Tuition payments submitted")}
        ${stat("Registration", open ? badge("Open", "ok") : badge("Closed", "closed"),
          `<button class="small ${open ? "danger" : ""}" id="toggleReg" type="button">${open ? "Close registration" : "Open registration"}</button>`)}
      </div>

      <div class="grid cols-2 section-gap">
        <section class="card">
          <div class="card-head"><h3>Recent tuition payments</h3>
            <a class="btn secondary small" href="students.html">Manage students</a></div>
          ${recent.length ? `<div class="table-wrap"><table>
            <thead><tr><th>Student</th><th>Transaction</th><th class="hide-sm">Date</th><th>Receipt</th></tr></thead>
            <tbody>${recent.map((p) => `
              <tr><td class="num">${escapeHtml(p.studentId)}</td><td class="num">${escapeHtml(p.transactionNumber)}</td>
              <td class="hide-sm num">${formatDate(p.createdAt)}</td>
              <td><button class="secondary small" type="button" data-download-url="/api/payments/${encodeURIComponent(p.id)}/receipt"
                    data-filename="receipt-${escapeHtml(p.receiptNumber)}.pdf">${icon("download")} PDF</button></td></tr>`).join("")}
            </tbody></table></div>`
            : `<div class="empty">No tuition payments yet.</div>`}
        </section>

        <section class="card">
          <h3 style="margin-bottom:12px">Quick actions</h3>
          <div class="actions">
            <a class="action" href="students.html">
              <span class="action-icon">${icon("students")}</span>
              <span><strong>Manage students</strong><small>Add students and set drug testing clearance</small></span>
            </a>
            <a class="action" href="results.html">
              <span class="action-icon">${icon("results")}</span>
              <span><strong>Record grades</strong><small>Enter results and download statements</small></span>
            </a>
          </div>
        </section>
      </div>`;

    document.getElementById("toggleReg").addEventListener("click", async (e) => {
      const btn = e.currentTarget;
      setBusy(btn, true, "Saving...");
      const { ok, data } = await putJSON("/api/settings", { registrationPeriodOpen: !open });
      if (ok) { notify(data.registrationPeriodOpen ? "Registration is now open" : "Registration is now closed"); renderAdmin(); }
      else { setBusy(btn, false); notify(data.message, true); }
    });
  }

  if (user) {
    (user.role === "admin" ? renderAdmin() : renderStudent()).catch(() => {
      box.innerHTML = `<div class="message error show">Something went wrong. Please refresh the page.</div>`;
    });
  }
</script>
</body>
</html>
