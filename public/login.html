<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Log in · CST SMS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="login-screen">
  <div class="login-card">
    <img class="login-logo" src="assets/cst-logo.jpg" alt="College of Science and Technology logo" />
    <h1>Student Management System</h1>
    <p class="login-sub">College of Science and Technology</p>

    <form id="loginForm" class="login-form" novalidate>
      <label for="studentId">Student ID</label>
      <input id="studentId" name="studentId" inputmode="numeric" maxlength="8" placeholder="8-digit Student ID" autocomplete="username" aria-describedby="idError" />
      <div class="field-error" id="idError"></div>

      <label for="password">Password</label>
      <div class="pw-wrap">
        <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" aria-describedby="pwError" />
        <button class="pw-toggle" id="pwToggle" type="button" aria-controls="password" aria-label="Show password">Show</button>
      </div>
      <div class="field-error" id="pwError"></div>

      <button class="login-btn" type="submit" id="loginBtn">Log in</button>
    </form>
    <div id="msg" class="message" role="status"></div>
    <p class="login-foot">Use the Student ID and password issued by the college.</p>
  </div>
</main>

<script src="app.js"></script>
<script>
  if (getToken() && getUser()) window.location.href = "index.html";

  const msg = document.getElementById("msg");
  const flash = sessionStorage.getItem("flash");
  if (flash) {
    showMessage(msg, flash, true);
    sessionStorage.removeItem("flash");
  }

  const idInput = document.getElementById("studentId");
  const pwInput = document.getElementById("password");
  const idError = document.getElementById("idError");
  const pwError = document.getElementById("pwError");

  idInput.addEventListener("input", () => { idInput.value = idInput.value.replace(/\D/g, ""); });

  document.getElementById("pwToggle").addEventListener("click", (e) => {
    const show = pwInput.type === "password";
    pwInput.type = show ? "text" : "password";
    e.currentTarget.textContent = show ? "Hide" : "Show";
    e.currentTarget.setAttribute("aria-label", show ? "Hide password" : "Show password");
  });

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearMessage(msg);
    idError.textContent = idInput.value.length === 8 ? "" : (idInput.value ? "Student ID must be exactly 8 digits." : "Enter your Student ID.");
    pwError.textContent = pwInput.value ? "" : "Enter your password.";
    idInput.setAttribute("aria-invalid", String(!!idError.textContent));
    pwInput.setAttribute("aria-invalid", String(!!pwError.textContent));
    if (idError.textContent || pwError.textContent) return;

    const btn = document.getElementById("loginBtn");
    setBusy(btn, true, "Logging in...");
    const { ok, data } = await postJSON("/api/login", { studentId: idInput.value, password: pwInput.value });
    if (ok) {
      saveSession(data.token, data.user);
      showMessage(msg, "Login successful. Opening your dashboard...", false);
      setTimeout(() => (window.location.href = "index.html"), 500);
    } else {
      setBusy(btn, false);
      showMessage(msg, data.message || "Log in failed. Please try again.", true);
    }
  });
</script>
</body>
</html>
