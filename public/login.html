<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login &mdash; CST SMS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <span class="crest">CST &middot; RUB</span>
  <h1>Student Management System</h1>
</header>
<nav id="nav"></nav>
<main>
  <div class="card">
    <h2>Student Login</h2>
    <form id="loginForm">
      <label for="studentId">Student ID</label>
      <input id="studentId" name="studentId" placeholder="e.g. 02230123" autocomplete="username" />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="e.g. Passw0rd" autocomplete="current-password" />

      <button type="submit">Log In</button>
    </form>
    <div id="msg" class="message"></div>
    <p class="hint">
      Demo student: 02230123 / Passw0rd<br />
      Demo admin: 00000001 / Admin123
    </p>
  </div></main>
<script src="app.js"></script>
<script>
  if (getToken() && getUser()) window.location.href = "index.html";

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const studentId = document.getElementById("studentId").value;
    const password = document.getElementById("password").value;
    const msg = document.getElementById("msg");
    const { ok, data } = await postJSON("/api/login", { studentId, password });
    showMessage(msg, data.message, !ok);
    if (ok) {
      saveSession(data.token, data.user);
      setTimeout(() => (window.location.href = "index.html"), 600);
    }
  });
</script>
</body>
</html>
