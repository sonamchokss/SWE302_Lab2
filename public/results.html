<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Results · CST SMS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="overlay" id="overlay"></div>
  <div class="content">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"></button>
      <h1 class="topbar-title" id="pageTitle">Results</h1>
      <div class="spacer"></div>
      <div class="user-chip" id="userChip"></div>
    </header>

    <main class="page">
      <div class="page-head">
        <h2 id="heading">My results</h2>
        <p id="subheading">Your published grades. Download a statement for your records.</p>
      </div>

      <!-- Student view -->
      <section class="card" id="studentView" hidden>
        <div class="card-head">
          <h3>Grades</h3>
          <button type="button" class="secondary" id="ownStatement" data-download-url="" data-filename="">Download statement (PDF)</button>
        </div>
        <div id="ownResults"><div class="empty">Loading...</div></div>
      </section>

      <!-- Admin view -->
      <div id="adminView" hidden>
        <div class="grid cols-2">
          <section class="card">
            <div class="card-head"><h3>All results</h3></div>
            <label for="filter" style="margin-top:0">Filter by student ID or module</label>
            <input id="filter" placeholder="Type to filter, e.g. 02230123 or SWE302" autocomplete="off" />
            <div id="allResults" class="section-gap"><div class="empty">Loading...</div></div>
          </section>

          <div class="stack">
            <section class="card">
              <h3 style="margin-bottom:12px">Download a student's statement</h3>
              <form id="statementForm" novalidate>
                <label for="stuStatement" style="margin-top:0">Student ID</label>
                <input id="stuStatement" inputmode="numeric" maxlength="8" placeholder="e.g. 02230123" />
                <div class="field-error" id="stmtError"></div>
                <div class="form-actions"><button type="submit" class="secondary" id="stmtBtn">Download statement (PDF)</button></div>
              </form>
            </section>

            <section class="card">
              <h3 style="margin-bottom:12px">Record a grade</h3>
              <form id="recordForm" novalidate>
                <label for="recStudent" style="margin-top:0">Student ID</label>
                <input id="recStudent" inputmode="numeric" maxlength="8" placeholder="e.g. 02230123" />
                <div class="field-error" id="recStudentError"></div>

                <label for="recModule">Module</label>
                <select id="recModule"></select>

                <label for="recGrade">Grade</label>
                <select id="recGrade">
                  <option value="">Choose a grade</option>
                  <option>A+</option><option>A</option><option>A-</option>
                  <option>B+</option><option>B</option><option>B-</option>
                  <option>C+</option><option>C</option><option>C-</option>
                  <option>D+</option><option>D</option><option>D-</option>
                  <option>F</option>
                </select>
                <div class="field-error" id="recGradeError"></div>

                <div class="form-actions"><button type="submit" id="recBtn">Save grade</button></div>
              </form>
              <div id="recMsg" class="message" role="status"></div>
            </section>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="app.js"></script>
<script>
  const user = requireLogin();
  if (user) initShell("results", "Results");

  const ID_PATTERN = /^\d{8}$/;
  let allResults = [];

  function resultsTable(list, showStudent) {
    if (!list.length) return `<div class="empty">No results published yet.</div>`;
    return `<div class="table-wrap"><table>
      <thead><tr>${showStudent ? "<th>Student</th>" : ""}<th>Code</th><th>Module</th><th>Grade</th></tr></thead>
      <tbody>${list.map((r) => `<tr>
        ${showStudent ? `<td class="num">${escapeHtml(r.studentId)}</td>` : ""}
        <td class="num"><strong>${escapeHtml(r.moduleCode)}</strong></td>
        <td>${escapeHtml(r.moduleTitle)}</td>
        <td>${gradeChip(r.grade)}</td></tr>`).join("")}
      </tbody></table></div>`;
  }

  async function loadStudent() {
    document.getElementById("studentView").hidden = false;
    const btn = document.getElementById("ownStatement");
    btn.dataset.downloadUrl = `/api/results/${encodeURIComponent(user.studentId)}/pdf`;
    btn.dataset.filename = `results-${user.studentId}.pdf`;
    const { ok, data } = await getJSON("/api/results");
    document.getElementById("ownResults").innerHTML = ok ? resultsTable(data, false) : `<div class="message error show">${escapeHtml(data.message)}</div>`;
  }

  function renderAll() {
    const q = document.getElementById("filter").value.trim().toLowerCase();
    const list = allResults.filter((r) =>
      !q || r.studentId.includes(q) || r.moduleCode.toLowerCase().includes(q) || r.moduleTitle.toLowerCase().includes(q));
    document.getElementById("allResults").innerHTML = resultsTable(list, true);
  }

  async function loadAdmin() {
    document.getElementById("adminView").hidden = false;
    document.getElementById("heading").textContent = "Results management";
    document.getElementById("subheading").textContent = "Record grades, search results and download statements.";

    const [res, mods] = await Promise.all([getJSON("/api/results"), getJSON("/api/modules")]);
    if (res.ok) { allResults = res.data; renderAll(); }
    if (mods.ok) {
      document.getElementById("recModule").innerHTML = mods.data
        .map((m) => `<option value="${escapeHtml(m.moduleCode)}">${escapeHtml(m.moduleCode)} · ${escapeHtml(m.moduleTitle)}</option>`).join("");
    }
  }

  function markField(input, errorEl, message) {
    errorEl.textContent = message;
    input.setAttribute("aria-invalid", String(!!message));
  }

  if (user && user.role === "admin") {
    loadAdmin();
    document.getElementById("filter").addEventListener("input", renderAll);

    document.getElementById("statementForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("stuStatement");
      const id = input.value.trim();
      markField(input, document.getElementById("stmtError"), ID_PATTERN.test(id) ? "" : "Enter an 8-digit Student ID.");
      if (!ID_PATTERN.test(id)) return input.focus();
      const btn = document.getElementById("stmtBtn");
      setBusy(btn, true, "Preparing PDF...");
      try {
        await downloadFile(`/api/results/${encodeURIComponent(id)}/pdf`, `results-${id}.pdf`);
      } catch (err) {
        notify(err.message, true);
      } finally {
        setBusy(btn, false);
      }
    });

    document.getElementById("recordForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const idInput = document.getElementById("recStudent");
      const gradeSel = document.getElementById("recGrade");
      const id = idInput.value.trim();
      markField(idInput, document.getElementById("recStudentError"), ID_PATTERN.test(id) ? "" : "Enter an 8-digit Student ID.");
      markField(gradeSel, document.getElementById("recGradeError"), gradeSel.value ? "" : "Choose a grade.");
      if (!ID_PATTERN.test(id) || !gradeSel.value) return;

      const btn = document.getElementById("recBtn");
      setBusy(btn, true, "Saving...");
      const { ok, data } = await postJSON("/api/results", {
        studentId: id,
        moduleCode: document.getElementById("recModule").value,
        grade: gradeSel.value,
      });
      setBusy(btn, false);
      const msg = document.getElementById("recMsg");
      if (ok) {
        showMessage(msg, `Saved grade ${gradeSel.value} for ${id}`, false);
        notify("Grade saved");
        e.target.reset();
        loadAdmin();
      } else {
        showMessage(msg, data.message || "The grade could not be saved.", true);
      }
    });
  } else if (user) {
    loadStudent();
  }
</script>
</body>
</html>
